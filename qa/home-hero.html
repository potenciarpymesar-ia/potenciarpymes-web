<!doctype html>
<html lang="es-AR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>QA del hero — anchos reales</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#e5e3dc;color:#11110f;font:14px/1.5 system-ui}header{padding:12px 20px;background:#fff;position:sticky;top:0;z-index:2}h1{font-size:16px;margin:0 0 8px}button,a{font:inherit;min-height:40px;padding:8px 14px;margin-right:5px}button[aria-pressed=true]{background:#d7ff3f}a{color:inherit}#stage{width:100%;overflow:hidden;min-height:980px}#frame{display:block;border:0;transform-origin:top left;margin:0 auto}#report{white-space:pre-wrap;margin:8px 0 0;font:12px/1.5 monospace}.note{margin:5px 0 0}
</style>
<header><h1>QA del hero — cada marco usa su ancho real de viewport</h1><nav aria-label="Ancho del marco"><button data-width="320">320 px</button><button data-width="375">375 px</button><button data-width="390" aria-pressed="true">390 px</button><button data-width="430">430 px</button><button data-width="768">768 px</button><button data-width="1440">1440 px</button></nav><button id="inspect">Comprobar diseño</button><button id="zoom">Texto al 200%</button><a href="/">Abrir home</a><p class="note">QA interno. No simula Safari ni un teléfono físico. No enviar formularios.</p><pre id="report" role="status">Cargando…</pre></header>
<main id="stage"><iframe id="frame" title="Home a 390 px" src="/" width="390" height="980"></iframe></main>
<script>
(function(){
  var frame=document.getElementById('frame'),width=390,enlarged=false;
  function size(){var scale=Math.min(1,document.getElementById('stage').clientWidth/width);frame.width=width;frame.style.width=width+'px';frame.style.transform='scale('+scale+')';frame.title='Home a '+width+' px';}
  function inspect(){var doc=frame.contentDocument,hero=doc.querySelector('[data-cinematic-hero]');if(!hero)return;
    var button=hero.querySelector('[data-hero-motion]'),rect=button.getBoundingClientRect(),step=hero.querySelector('.hero-scene-steps').getBoundingClientRect();
    var lineRects=Array.from(hero.querySelectorAll('.hero-title-line')).map(function(el){var r=el.getBoundingClientRect();return {left:r.left,right:r.right,top:r.top,bottom:r.bottom};});
    var cta=hero.querySelector('.button').getBoundingClientRect();
    document.getElementById('report').textContent=JSON.stringify({viewport:frame.contentWindow.innerWidth,overflow:doc.documentElement.scrollWidth>frame.contentWindow.innerWidth,titleWithinViewport:lineRects.every(function(r){return r.left>=0&&r.right<=width;}),titleLinesSeparated:lineRects.every(function(r,i){return !i||r.top>=lineRects[i-1].bottom-1;}),captionButtonOverlap:!button.hidden&&rect.left<step.right&&rect.right>step.left&&rect.top<step.bottom&&rect.bottom>step.top,ctaBottom:Math.round(cta.bottom),font:frame.contentWindow.getComputedStyle(hero.querySelector('h1')).fontFamily,motion:hero.dataset.motion,devices:hero.querySelectorAll('.device-phone,.device-laptop').length,notifications:hero.querySelectorAll('.phone-notification').length},null,2);
  }
  document.querySelectorAll('[data-width]').forEach(function(button){button.addEventListener('click',function(){width=Number(button.dataset.width);document.querySelectorAll('[data-width]').forEach(function(b){b.setAttribute('aria-pressed',String(b===button));});size();});});
  document.getElementById('inspect').addEventListener('click',inspect);
  document.getElementById('zoom').addEventListener('click',function(){enlarged=!enlarged;frame.contentDocument.documentElement.style.fontSize=enlarged?'200%':'';this.textContent=enlarged?'Texto al 100%':'Texto al 200%';});
  frame.addEventListener('load',function(){size();inspect();});window.addEventListener('resize',size);size();
})();
</script>
</html>
